<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رزونانس | پادکست و نشریات انجمن علمی شیمی دانشگاه گلستان</title>
<meta name="description" content="رزونانس؛ پادکست، نشریه، هفته‌نامه، برنامهٔ کارگاه‌ها و اخبار انجمن علمی شیمی دانشگاه گلستان.">
<meta property="og:title" content="رزونانس | انجمن علمی شیمی دانشگاه گلستان">
<meta property="og:description" content="پادکست، نشریه، هفته‌نامه، کارگاه‌ها و اخبار انجمن علمی شیمی دانشگاه گلستان.">
<meta property="og:image" content="logo.svg">
<meta property="og:locale" content="fa_IR">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="canonical" href="https://erffan348-dotcom.github.io/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"رزونانس - انجمن علمی شیمی دانشگاه گلستان","url":"https://erffan348-dotcom.github.io/","logo":"https://erffan348-dotcom.github.io/logo.svg"}</script>
<style>
:root{--bk:#0a0607;--rd:#b01c30;--dr:#4a0d16;--cr:#efe6d8;--mu:#b9a99c;--ln:#2a1418}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bk);color:var(--cr);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
a{color:inherit}.w{max-width:980px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:5;background:rgba(10,6,7,.94);border-bottom:1px solid var(--ln)}
header.top .w{display:flex;align-items:center;gap:18px;overflow-x:auto;white-space:nowrap}
.brand{font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--cr);padding:8px 0}
header.top a.l{color:var(--mu);text-decoration:none;font-size:.92rem;padding:10px 0}
header.top a.l:hover,a:focus-visible{color:var(--cr);outline:2px solid var(--rd);outline-offset:3px}
.hero{background:radial-gradient(circle at 50% 30%,var(--dr),var(--bk) 62%);text-align:center;padding:42px 0 30px}
.hero img{width:min(300px,78vw);height:auto;border-radius:6px}
.hero h1{margin:18px 0 4px;font-size:1.7rem;font-weight:800}
.hero p{margin:0 auto;max-width:520px;color:var(--mu)}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:46px;margin-top:22px}
.wave i{width:3px;background:var(--rd);border-radius:2px;height:var(--h);animation:p 1.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes p{50%{transform:scaleY(.35)}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none}}
section{padding:34px 0;border-top:1px solid var(--ln)}
h2{margin:0 0 16px;font-size:1.3rem;border-right:4px solid var(--rd);padding-right:12px}
.list{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
article{background:#140a0c;border:1px solid var(--ln);border-radius:4px;padding:16px}
article h3{margin:0 0 2px;font-size:1.05rem}
.m{color:var(--mu);font-size:.82rem}article p{margin:8px 0;color:var(--mu);font-size:.92rem;white-space:pre-line}
audio{width:100%;margin-top:6px}
.b{display:inline-block;background:var(--rd);color:#fff;text-decoration:none;padding:4px 16px;border-radius:3px;font-size:.9rem}
.e{color:var(--mu);border:1px dashed var(--ln);padding:22px;text-align:center}
footer{border-top:1px solid var(--ln);padding:26px 0;text-align:center;color:var(--mu);font-size:.85rem}
</style>
</head>
<body>
<header class="top"><div class="w">
<a class="brand" href="#">رزونانس</a>
<a class="l" href="#news">اخبار</a><a class="l" href="#podcasts">پادکست‌ها</a><a class="l" href="#publications">نشریات</a><a class="l" href="#weekly">هفته‌نامه</a><a class="l" href="#workshops">کارگاه‌ها</a>
</div></header>
<div class="hero"><div class="w">
<img src="logo.svg" alt="لوگوی رزونانس، پادکست انجمن شیمی دانشگاه گلستان" width="380" height="380">
<h1>انجمن علمی شیمی دانشگاه گلستان</h1>
<p>پادکست، نشریه و هفته‌نامه‌هایی که تولید می‌کنیم، همراه با برنامهٔ کارگاه‌ها و اخبار انجمن.</p>
<div class="wave" id="wave" aria-hidden="true"></div>
</div></div>
<main class="w">
<section id="news"><h2>اخبار</h2><div class="list" id="l-news"></div></section>
<section id="podcasts"><h2>پادکست‌ها</h2><div class="list" id="l-podcasts"></div></section>
<section id="publications"><h2>نشریات</h2><div class="list" id="l-publications"></div></section>
<section id="weekly"><h2>هفته‌نامه</h2><div class="list" id="l-weekly"></div></section>
<section id="workshops"><h2>کارگاه‌ها</h2><div class="list" id="l-workshops"></div></section>
<noscript><p class="e">برای دیدن محتوا، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
</main>
<footer>© رزونانس، انجمن علمی شیمی دانشگاه گلستان</footer>
<script>
const w=document.getElementById("wave");
for(let i=0;i<48;i++){const b=document.createElement("i");b.style.setProperty("--h",(8+Math.abs(Math.sin(i*.55))*34+(i%5))+"px");b.style.setProperty("--d",(i%12)*.12+"s");w.append(b)}
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function card(it,kind){
  const a=mk("article");a.append(mk("h3","",it.title||""));
  const meta=[it.date,it.when,it.place].filter(Boolean).join(" · ");if(meta)a.append(mk("div","m",meta));
  if(it.desc)a.append(mk("p","",it.desc));
  if(it.audio){const au=mk("audio");au.controls=true;au.preload="none";au.src=it.audio;a.append(au)}
  const href=it.file||it.link;
  if(href){const l=mk("a","b",kind==="workshops"?"ثبت‌نام":"دریافت فایل");l.href=href;if(it.file)l.setAttribute("download","");a.append(l)}
  return a}
fetch("content.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  for(const k of ["news","podcasts","publications","weekly","workshops"]){
    const box=document.getElementById("l-"+k),items=d[k]||[];
    if(!items.length)box.append(mk("p","e","به‌زودی"));
    items.forEach(it=>box.append(card(it,k)));
  }}).catch(()=>{document.querySelectorAll(".list").forEach(b=>b.append(mk("p","e","بارگذاری محتوا ممکن نشد.")))});
</script>
</body>
</html>
